[build-system]
requires = ["setuptools>=77"]   # PEP 639 SPDX license expression + license-files
build-backend = "setuptools.build_meta"

[project]
name = "ai-session-search"
description = "Read-only local web viewer for Claude Code session transcripts (JSONL), with verified human-vs-machine message attribution"
readme = "README.md"
requires-python = ">=3.9"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Kim Dongryeong (kdr)", email = "kdr@namouli.com" }]
keywords = ["claude", "claude-code", "transcript", "viewer", "history", "search", "llm"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Utilities",
]
dynamic = ["version"]
dependencies = []  # stdlib only, by design

[project.scripts]
ai-session-search = "ai_session_search.app:main"
aiss = "ai_session_search.app:main"
ass = "ai_session_search.app:main"   # short + memorable alias

[project.urls]
Homepage = "https://github.com/kim-dongryeong/ai-session-search"
Repository = "https://github.com/kim-dongryeong/ai-session-search"
Issues = "https://github.com/kim-dongryeong/ai-session-search/issues"

[tool.setuptools]
package-dir = { "" = "src" }
packages = ["ai_session_search"]
include-package-data = true

[tool.setuptools.package-data]
ai_session_search = ["locales/*.json", "demo/**/*.jsonl"]

[tool.setuptools.dynamic]
version = { attr = "ai_session_search.app.__version__" }
